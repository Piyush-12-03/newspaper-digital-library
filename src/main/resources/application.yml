spring:
  application:
    name: newspaper-digital-library

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mvc:
    servlet:
      path: /api/v1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/newspaper_library}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml
    drop-first: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# JWT Configuration (1 hour expiry)
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-make-it-secure-and-random}
  expiration: 3600000  # 1 hour in milliseconds (60 * 60 * 1000)

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# Newspaper API Configuration
newspaper:
  api:
    max-date-range-days: 90
    default-page-size: 20
    max-page-size: 100
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:e-newspaper-library-local}
      region: ${AWS_REGION:us-east-1}
      max-file-size-mb: 50
      download-url-expiration-minutes: 10
      connection-timeout-ms: 5000
      api-call-timeout-ms: 30000
